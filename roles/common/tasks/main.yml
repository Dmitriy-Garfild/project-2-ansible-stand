---
- name: Обновить кэш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Установить таймзону
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Настроить /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
    backup: true
