---
netplan_config:
  network:
    version: 2
    renderer: networkd
    ethernets:
      enp0s3:
        dhcp4: false
        addresses:
          - "10.10.10.12/24"
        routes:
          - to: default
            via: "10.10.10.1"
        nameservers:
          addresses:
            - "10.10.10.1"
            - "1.1.1.1"
      enp0s8:
        dhcp4: false
        dhcp6: false
        addresses:
          - "192.168.1.12/24"
